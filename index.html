<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xbox Vault</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#091811">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23151B18'/><path d='M6 9l8 14M14 9L6 23M18 9l4 14 4-14' fill='none' stroke='%239BCB3C' stroke-width='3' stroke-linecap='square'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <!-- O nome do site e tambem a troca de area. O CollectionUI ainda nao tem
         tela: o item fica inerte ate a pagina dele existir. -->
    <div class="lado">
      <div class="menu">
        <button class="brand" aria-haspopup="menu" aria-expanded="false">Xbox Vault <span class="seta" aria-hidden="true"></span></button>
        <div class="menu-lista esq" role="menu" hidden>
          <a role="menuitem" class="menu-item atual" aria-current="page">Catálogo<small>Todos os jogos e o que você marcou</small></a>
          <a role="menuitem" class="menu-item" aria-disabled="true">CollectionUI<small>Montar coleções para o console · em breve</small></a>
        </div>
      </div>
    </div>
    <label class="search"><input id="q" type="search" placeholder="Buscar jogo, estúdio ou publisher" autocomplete="off"></label>
    <div class="actions">
      <button class="btn mobile-filters" id="btn-filters">Filtros</button>
      <!-- Importar e exportar sao as duas pontas da mesma coisa, o arquivo com o
           que voce marcou: ficam num menu so. -->
      <div class="menu" id="menu-backup">
        <button class="btn" id="btn-backup" aria-haspopup="menu" aria-expanded="false">Arquivo <span class="seta" aria-hidden="true"></span></button>
        <!-- Cada item diz de qual arquivo se trata: no CollectionUI este mesmo menu vai
             importar e exportar o arquivo do console. -->
        <div class="menu-lista" role="menu" hidden>
          <button role="menuitem" class="menu-item" id="btn-export">Exportar arquivo do Xbox Vault</button>
          <button role="menuitem" class="menu-item" id="btn-import">Importar arquivo do Xbox Vault</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="side" id="side">
    <div class="side-top">
      <b>Filtros</b>
      <button class="side-x" id="side-x" aria-label="Fechar filtros">&times;</button>
    </div>
    <div class="side-scroll">
    <!-- Grupos recolhiveis, na ordem do que mais corta a lista. Os que so valem
         para uma plataforma (retrocompatibilidade, extras, categoria, emulacao)
         ficam escondidos ate ela ser marcada: data-plat diz qual. -->
    <!-- Ordenar nao e filtro: nao corta a lista, entao nao recolhe como os grupos. -->
    <div class="fgroup fixo">
      <h4>Ordenar por</h4>
      <select id="f-sort">
        <option value="year-desc">Mais novos</option>
        <option value="year-asc">Mais antigos</option>
        <option value="title">Título (A–Z)</option>
        <option value="mc">Nota do Metacritic</option>
        <option value="players">Mais jogadores</option>
      </select>
    </div>

    <details class="fgroup" data-g="plat" open>
      <summary><h4>Plataforma</h4></summary>
      <label class="chk"><input type="checkbox" class="f-plat" value="x360" checked> Xbox 360 <span class="n" data-cnt="plat-x360"></span></label>
      <label class="chk"><input type="checkbox" class="f-plat" value="xbox" checked> Xbox original <span class="n" data-cnt="plat-xbox"></span></label>
      <label class="chk"><input type="checkbox" class="f-plat" value="xblig"> Indie (XBLIG) <span class="n" data-cnt="plat-xblig"></span></label>
      <label class="chk"><input type="checkbox" class="f-plat" value="homebrew"> Homebrew <span class="n" data-cnt="plat-homebrew"></span></label>
      <label class="chk"><input type="checkbox" class="f-plat" value="emu"> Emulação <span class="n" data-cnt="plat-emu"></span></label>
    </details>

    <details class="fgroup" data-g="emu" data-plat="emu" id="g-emu" open hidden>
      <summary><h4>Emulação</h4></summary>
      <label class="chk"><input type="checkbox" class="f-sys" value="SNES"> SNES</label>
      <label class="chk"><input type="checkbox" class="f-sys" value="GBA"> Game Boy Advance</label>
      <label class="chk"><input type="checkbox" class="f-sys" value="PS1"> PlayStation 1</label>
      <select id="f-reltype" style="margin-top:8px">
        <option value="oficial">Lançamentos oficiais (+ vazados jogáveis)</option>
        <option value="all">Tudo (inclui ROM hacks)</option>
        <option value="vaz">Só cancelados que vazaram jogáveis</option>
        <option value="hack">Só ROM hacks</option>
        <option value="hb">Só homebrew</option>
      </select>
    </details>

    <details class="fgroup" data-g="ano" open>
      <summary><h4>Ano</h4></summary>
      <div class="seg" role="radiogroup" aria-label="Tipo de filtro de ano">
        <label><input type="radio" name="f-ymode" value="um"> Um ano</label>
        <label><input type="radio" name="f-ymode" value="intervalo"> Intervalo</label>
      </div>
      <div class="row2">
        <select id="f-y1" aria-label="Ano inicial"></select><span class="y-ate">até</span><select id="f-y2" aria-label="Ano final"></select>
      </div>
    </details>

    <details class="fgroup" data-g="mc" open>
      <summary><h4>Nota do Metacritic</h4></summary>
      <select id="f-mc">
        <option value="0">Qualquer (inclui sem nota)</option>
        <option value="60">60 ou mais</option>
        <option value="70">70 ou mais</option>
        <option value="75">75 ou mais</option>
        <option value="80">80 ou mais</option>
        <option value="85">85 ou mais</option>
        <option value="90">90 ou mais</option>
      </select>
    </details>

    <!-- Eram sete caixas que se sobrepunham (co-op e co-op local, versus e versus
         local, multiplayer local...) e um bloco separado de jogadores. Agora o modo
         diz COMO se joga, o "onde" vale para os dois e jogadores herda o mesmo onde. -->
    <details class="fgroup" data-g="modo" open>
      <summary><h4>Modo de jogo</h4></summary>
      <label class="chk"><input type="checkbox" class="f-mode" value="singlePlayer"> Sozinho <span class="n" data-cnt="m-singlePlayer"></span></label>
      <label class="chk"><input type="checkbox" class="f-mode" value="coop"> Co-op <span class="n" data-cnt="m-coop"></span></label>
      <label class="chk"><input type="checkbox" class="f-mode" value="versus"> Versus <span class="n" data-cnt="m-versus"></span></label>
      <div class="sub-h">Onde</div>
      <div class="seg" role="radiogroup" aria-label="Onde">
        <label><input type="radio" name="f-where" value="any"> Tanto faz</label>
        <label><input type="radio" name="f-where" value="local"> Local</label>
        <label><input type="radio" name="f-where" value="online"> Online</label>
      </div>
      <div class="sub-h">Jogadores</div>
      <select id="f-pl-min">
        <option value="0">Qualquer número</option>
        <option value="2">2 ou mais</option><option value="3">3 ou mais</option>
        <option value="4">4 ou mais</option><option value="6">6 ou mais</option>
        <option value="8">8 ou mais</option><option value="12">12 ou mais</option>
        <option value="16">16 ou mais</option><option value="24">24 ou mais</option>
      </select>
      <!-- Co-Optimus e catalogo de co-op mantido a mao, jogo a jogo: quem quer
           confiar no dado de co-op, e nao na nossa inferencia, liga isto. -->
      <label class="chk chk-sep"><input type="checkbox" id="f-coopt"> Só com dados do Co-Optimus <span class="n" data-cnt="coopt"></span></label>
    </details>

    <details class="fgroup" data-g="genero" open>
      <summary><h4>Gênero</h4></summary>
      <div class="genre-box" id="f-genres"></div>
      <button type="button" class="mais" id="genre-mais" hidden>+ Mostrar mais</button>
    </details>

    <details class="fgroup" data-g="bc" data-plat="xbox" open>
      <summary><h4>Xbox original</h4></summary>
      <select id="f-bc" aria-label="Retrocompatibilidade do Xbox original">
        <option value="all">Todos</option>
        <option value="yes">Só os retrocompatíveis</option>
        <option value="no">Só os sem retrocompatibilidade</option>
      </select>
    </details>

    <details class="fgroup" data-g="extras" data-plat="x360" open>
      <summary><h4>Xbox 360</h4></summary>
      <label class="chk"><input type="checkbox" class="f-flag" value="xbla"> Só XBLA <span class="n" data-cnt="f-xbla"></span></label>
      <label class="chk"><input type="checkbox" class="f-flag" value="kinect"> Só Kinect <span class="n" data-cnt="f-kinect"></span></label>
    </details>

    <details class="fgroup" data-g="cat" data-plat="homebrew" open>
      <summary><h4>Categoria do homebrew</h4></summary>
      <select id="f-cat"><option value="">Todas</option></select>
    </details>

    <button class="btn" id="btn-reset" style="width:100%">Limpar filtros</button>
    </div>
    <div class="side-bot">
      <button class="btn primary" id="side-done">Ver <b id="side-n">0</b> jogos</button>
    </div>
  </aside>

  <main class="main">
    <!-- O que e SEU (tenho, wishlist, escondidos) e um recorte do catalogo inteiro,
         e nao mais um filtro entre os outros: vira aba, como Jogos/Filmes/Series no
         Metacritic. A contagem de cada uma mora na propria aba. -->
    <div class="vistas-linha">
    <nav class="vistas" role="tablist" aria-label="Coleção">
      <button role="tab" class="vista" data-own="all">Todos</button>
      <button role="tab" class="vista" data-own="yes">Tenho <b id="s-own">0</b></button>
      <button role="tab" class="vista" data-own="no">Faltam</button>
      <button role="tab" class="vista" data-own="none">Não marcados</button>
      <button role="tab" class="vista" data-own="wish">Wishlist <b id="s-wish">0</b></button>
      <button role="tab" class="vista" data-own="hide">Escondidos <b id="s-hide">0</b></button>
    </nav>
    <span class="res-n"><b id="s-shown">0</b> de <span id="s-total">0</span> jogos</span>
    </div>
    <div id="main">
      <div class="loading">Carregando catálogo…</div>
    </div>
  </main>
</div>

<!-- modal export/import -->
<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="sheet-x" id="modal-x">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>
<input type="file" id="file-in" accept="application/json,.json" hidden>

<!-- visualizador de screenshots, por cima do popup de detalhes -->
<div class="lb" id="lb" hidden>
  <button class="lb-x" id="lb-x" title="Fechar (Esc)">&times;</button>
  <button class="lb-nav" id="lb-prev" title="Anterior (seta esquerda)">&#8249;</button>
  <img id="lb-img" alt="">
  <button class="lb-nav" id="lb-next" title="Próxima (seta direita)">&#8250;</button>
  <div class="lb-n" id="lb-n"></div>
</div>

<script src="data/db.js"></script>
<script src="app.js"></script>
</body>
</html>
